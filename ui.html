<!DOCTYPE html>
<html>
<head>
    <title>Figma Variables Exporter/Importer</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 15px;
            margin: 10px 0;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 200px;
            margin: 10px 0;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>Variables Exporter/Importer</h1>

    <button id="export">Export Variables</button>

    <textarea id="exportData" placeholder="Exported data will appear here" readonly></textarea>

    <textarea id="importData" placeholder="Paste JSON data here"></textarea>

    <button id="import">Import Variables</button>

    <script>
        document.getElementById('export').onclick = () => {
            parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
        }

        document.getElementById('import').onclick = () => {
            const data = document.getElementById('importData').value;
            parent.postMessage({ pluginMessage: { type: 'import', data: data } }, '*');
        }

        window.onmessage = event => {
            if (event.data.pluginMessage && event.data.pluginMessage.type === 'export-data') {
                document.getElementById('exportData').value = event.data.pluginMessage.data;
            }
        }
    </script>
</body>
</html>
